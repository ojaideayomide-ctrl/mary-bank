<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferro Bank</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e2e8f0;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo span { color: #38bdf8; }

  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }

  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }

  input {
    width: 100%;
    padding: 12px 14px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: #e2e8f0;
    font-size: 15px;
    margin-bottom: 18px;
    outline: none;
    transition: border 0.2s;
  }
  input:focus { border-color: #38bdf8; }

  button {
    width: 100%;
    padding: 13px;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #7dd3fc; }

  /* ---- Dashboard ---- */
  .dashboard { display: none; width: 100%; max-width: 480px; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .greeting { font-size: 15px; color: #94a3b8; }
  .greeting b { color: #e2e8f0; display: block; font-size: 18px; margin-top: 2px; }

  .logout {
    background: transparent;
    border: 1px solid #334155;
    color: #94a3b8;
    padding: 8px 14px;
    width: auto;
    font-size: 13px;
    font-weight: 500;
  }
  .logout:hover { background: #334155; color: #e2e8f0; }

  .balance-box {
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
  }
  .balance-box .lbl { font-size: 13px; opacity: 0.8; margin-bottom: 8px; }
  .balance-box .amt { font-size: 38px; font-weight: 700; letter-spacing: -1px; }
  .balance-box .acct { font-size: 13px; opacity: 0.8; margin-top: 14px; }

  .tx-title { font-size: 14px; color: #94a3b8; margin-bottom: 12px; }

  .tx {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #334155;
  }
  .tx:last-child { border-bottom: none; }
  .tx .name { font-size: 15px; }
  .tx .date { font-size: 12px; color: #64748b; margin-top: 3px; }
  .tx .amount { font-size: 15px; font-weight: 600; }
  .pos { color: #4ade80; }
  .neg { color: #f87171; }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <div class="logo">🏦 Ferro<span>Bank</span></div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your account</p>

    <label>Full name</label>
    <input id="nameInput" type="text" placeholder="e.g. Mary Ferro" autocomplete="off">

    <label>Password</label>
    <input id="passInput" type="password" placeholder="Any password works">

    <button onclick="login()">Sign in</button>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dash">
    <div class="topbar">
      <div class="greeting">Welcome back<b id="userName">—</b></div>
      <button class="logout" onclick="logout()">Log out</button>
    </div>

    <div class="balance-box">
      <div class="lbl">Available balance</div>
      <div class="amt">$12,450.00</div>
      <div class="acct" id="acctNum">•••• •••• •••• 4821</div>
    </div>

    <div class="tx-title">Recent transactions</div>

    <div class="tx">
      <div><div class="name">Salary Deposit</div><div class="date">Oct 12, 2026</div></div>
      <div class="amount pos">+$4,200.00</div>
    </div>
    <div class="tx">
      <div><div class="name">Amazon</div><div class="date">Oct 11, 2026</div></div>
      <div class="amount neg">−$89.99</div>
    </div>
    <div class="tx">
      <div><div class="name">Starbucks</div><div class="date">Oct 10, 2026</div></div>
      <div class="amount neg">−$6.45</div>
    </div>
    <div class="tx">
      <div><div class="name">Transfer from Alex</div><div class="date">Oct 9, 2026</div></div>
      <div class="amount pos">+$250.00</div>
    </div>
    <div class="tx">
      <div><div class="name">Netflix</div><div class="date">Oct 8, 2026</div></div>
      <div class="amount neg">−$15.99</div>
    </div>
  </div>

<script>
  function login() {
    const name = document.getElementById('nameInput').value.trim();
    const pass = document.getElementById('passInput').value;

    if (!name || !pass) {
      alert('Enter a name and password.');
      return;
    }

    document.getElementById('userName').textContent = name;

    // random fake card number
    const last4 = Math.floor(1000 + Math.random() * 9000);
    document.getElementById('acctNum').textContent = '•••• •••• •••• ' + last4;

    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    localStorage.setItem('fb_user', name);
  }

  function logout() {
    localStorage.removeItem('fb_user');
    document.getElementById('nameInput').value = '';
    document.getElementById('passInput').value = '';
    document.getElementById('dash').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
  }

  // keep you logged in on refresh
  window.onload = () => {
    const saved = localStorage.getItem('fb_user');
    if (saved) {
      document.getElementById('userName').textContent = saved;
      const last4 = Math.floor(1000 + Math.random() * 9000);
      document.getElementById('acctNum').textContent = '•••• •••• •••• ' + last4;
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('dash').style.display = 'block';
    }
  };
</script>
</body>
</html>
